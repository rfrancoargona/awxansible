---
- name: Validar variavel oracle_instances
  fail:
    msg: "Variavel oracle_instances nao definida no host"
  when: oracle_instances is not defined

- name: Exibir instancias configuradas
  debug:
    msg: "{{ item.sid }}"
  loop: "{{ oracle_instances }}"

# ==========================================================
# FULL
# ==========================================================
- name: Executar backup FULL
  raw: |
    /home/oracle/scripts/bkp_full_{{ item.sid }}.sh
  register: full_result
  loop: "{{ oracle_instances }}"
  when: backup_type == "full"

- name: Exibir retorno FULL
  debug:
    msg:
      - "SID: {{ item.item.sid }}"
      - "RC: {{ item.rc }}"
      - "{{ item.stdout_lines }}"
  loop: "{{ full_result.results | default([]) }}"
  when: backup_type == "full"

# ==========================================================
# ARCHIVELOG
# ==========================================================
- name: Executar backup ARCHIVELOG
  raw: |
    /home/oracle/scripts/bkp_arc_{{ item.sid }}.sh
  register: arch_result
  loop: "{{ oracle_instances }}"
  when: backup_type == "archivelog"

- name: Exibir retorno ARCHIVELOG
  debug:
    msg:
      - "SID: {{ item.item.sid }}"
      - "RC: {{ item.rc }}"
      - "{{ item.stdout_lines }}"
  loop: "{{ arch_result.results | default([]) }}"
  when: backup_type == "archivelog"

# ==========================================================
# CLEANUP
# ==========================================================
- name: Executar cleanup RMAN
  raw: |
    /home/oracle/scripts/cleanup_{{ item.sid }}.sh
  register: cleanup_result
  loop: "{{ oracle_instances }}"
  when: backup_type == "cleanup"

- name: Exibir retorno CLEANUP
  debug:
    msg:
      - "SID: {{ item.item.sid }}"
      - "RC: {{ item.rc }}"
      - "{{ item.stdout_lines }}"
  loop: "{{ cleanup_result.results | default([]) }}"
  when: backup_type == "cleanup"

# ==========================================================
# REPORT
# ==========================================================
- name: Executar report RMAN
  raw: |
    /home/oracle/scripts/rman_backup_report_{{ item.sid }}.sh
  register: report_result
  loop: "{{ oracle_instances }}"
  when: backup_type == "report"

- name: Exibir retorno REPORT
  debug:
    msg:
      - "SID: {{ item.item.sid }}"
      - "RC: {{ item.rc }}"
      - "{{ item.stdout_lines }}"
  loop: "{{ report_result.results | default([]) }}"
  when: backup_type == "report"
