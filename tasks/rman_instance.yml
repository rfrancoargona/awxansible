---
- name: Definir variáveis da instância
  set_fact:
    oracle_sid: "{{ db.sid }}"
    instance_base_dir: "{{ base_dir }}/{{ db.sid | lower }}"
    log_dir: "{{ instance_base_dir }}/logs"

- name: Garantir diretório de logs
  raw: mkdir -p {{ log_dir }}
  changed_when: false

- name: Definir timestamp
  set_fact:
    DATA: "{{ lookup('pipe','date +%Y%m%d_%H%M') }}"

# =========================================================
# ARCHIVELOG
# =========================================================

- name: Executar backup ARCHIVELOG
  raw: |
    export ORACLE_SID={{ oracle_sid }}
    export ORACLE_HOME={{ oracle_home }}
    export PATH=$ORACLE_HOME/bin:$PATH

    LOG={{ log_dir }}/backup_archivelog_{{ oracle_sid }}_{{ DATA }}.log
    TMPFILE=/tmp/rman_arch_{{ oracle_sid }}.logpath

    echo $LOG > $TMPFILE

    $ORACLE_HOME/bin/rman target / log=${LOG} <<EOF
    RUN {
      allocate channel d1 type disk format '{{ instance_base_dir }}/bkp_arc_%d_%U.rman' MAXPIECESIZE 64G;
      allocate channel d2 type disk format '{{ instance_base_dir }}/bkp_arc_%d_%U.rman' MAXPIECESIZE 64G;

      BACKUP ARCHIVELOG ALL DELETE INPUT;

      release channel d1;
      release channel d2;

      allocate channel d3 type disk;
      backup spfile format '{{ instance_base_dir }}/backup%d_%s_%p_%c_%t.spfile.rman';
      release channel d3;

      allocate channel d4 type disk;
      backup current controlfile format '{{ instance_base_dir }}/bkp_ctl_%d_%D%M%Y%t.rman';
      release channel d4;
    }
    exit;
    EOF
  register: arch_exec
  retries: 2
  delay: 30
  until: arch_exec.rc == 0
  when: backup_type == "archivelog"

- name: Validar log ARCHIVELOG
  raw: |
    LOG=$(cat /tmp/rman_arch_{{ oracle_sid }}.logpath 2>/dev/null)

    if [ -z "$LOG" ] || [ ! -f "$LOG" ]; then
      echo "LOG_NOT_FOUND"
      exit 0
    fi

    grep -E "RMAN-|ORA-" "$LOG" \
    | grep -v -E "RMAN-08137|RMAN-08120" \
    || true
  register: check_arch
  when: backup_type == "archivelog"

- name: Falhar se erro ARCHIVELOG
  fail:
    msg: "Erro RMAN ARCHIVELOG SID {{ oracle_sid }}: {{ check_arch.stdout }}"
  when:
    - backup_type == "archivelog"
    - check_arch.stdout not in ["", "LOG_NOT_FOUND"]

# =========================================================
# FULL
# =========================================================

- name: Executar backup FULL
  raw: |
    export ORACLE_SID={{ oracle_sid }}
    export ORACLE_HOME={{ oracle_home }}
    export PATH=$ORACLE_HOME/bin:$PATH

    LOG={{ log_dir }}/backup_full_{{ oracle_sid }}_{{ DATA }}.log
    TMPFILE=/tmp/rman_full_{{ oracle_sid }}.logpath

    echo $LOG > $TMPFILE

    $ORACLE_HOME/bin/rman target / log=${LOG} <<EOF
    RUN {
      allocate channel d1 type disk format '{{ instance_base_dir }}/bkp_full_%d_%U.rman' MAXPIECESIZE 64G;
      allocate channel d2 type disk format '{{ instance_base_dir }}/bkp_full_%d_%U.rman' MAXPIECESIZE 64G;

      BACKUP AS COMPRESSED BACKUPSET INCREMENTAL LEVEL 0 DATABASE PLUS ARCHIVELOG;

      release channel d1;
      release channel d2;

      allocate channel d3 type disk;
      backup spfile format '{{ instance_base_dir }}/backup%d_%s_%p_%c_%t.spfile.rman';
      release channel d3;

      allocate channel d4 type disk;
      backup current controlfile format '{{ instance_base_dir }}/bkp_ctl_%d_%D%M%Y%t.rman';
      release channel d4;
    }
    exit;
    EOF
  register: full_exec
  retries: 2
  delay: 30
  until: full_exec.rc == 0
  when: backup_type == "full"

- name: Validar log FULL
  raw: |
    LOG=$(cat /tmp/rman_full_{{ oracle_sid }}.logpath 2>/dev/null)

    if [ -z "$LOG" ] || [ ! -f "$LOG" ]; then
      echo "LOG_NOT_FOUND"
      exit 0
    fi

    grep -E "RMAN-|ORA-" "$LOG" \
    | grep -v -E "RMAN-08137|RMAN-08120" \
    || true
  register: check_full
  when: backup_type == "full"

- name: Falhar se erro FULL
  fail:
    msg: "Erro RMAN FULL SID {{ oracle_sid }}: {{ check_full.stdout }}"
  when:
    - backup_type == "full"
    - check_full.stdout not in ["", "LOG_NOT_FOUND"]

# =========================================================
# CLEANUP
# =========================================================

- name: Executar cleanup RMAN
  raw: |
    export ORACLE_SID={{ oracle_sid }}
    export ORACLE_HOME={{ oracle_home }}
    export PATH=$ORACLE_HOME/bin:$PATH

    LOG={{ log_dir }}/cleanup_{{ oracle_sid }}_{{ DATA }}.log
    TMPFILE=/tmp/rman_cleanup_{{ oracle_sid }}.logpath

    echo $LOG > $TMPFILE

    $ORACLE_HOME/bin/rman target / log=${LOG} <<EOF
    CONFIGURE RETENTION POLICY TO RECOVERY WINDOW OF 30 DAYS;
    CROSSCHECK BACKUP;
    DELETE NOPROMPT OBSOLETE DEVICE TYPE DISK;
    exit;
    EOF
  register: cleanup_exec
  retries: 2
  delay: 30
  until: cleanup_exec.rc == 0
  when: backup_type == "cleanup"

- name: Validar log CLEANUP
  raw: |
    LOG=$(cat /tmp/rman_cleanup_{{ oracle_sid }}.logpath 2>/dev/null)

    if [ -z "$LOG" ] || [ ! -f "$LOG" ]; then
      echo "LOG_NOT_FOUND"
      exit 0
    fi

    grep -E "RMAN-|ORA-" "$LOG" \
    | grep -v -E "RMAN-08137|RMAN-08120" \
    || true
  register: check_cleanup
  when: backup_type == "cleanup"

- name: Falhar se erro CLEANUP
  fail:
    msg: "Erro RMAN CLEANUP SID {{ oracle_sid }}: {{ check_cleanup.stdout }}"
  when:
    - backup_type == "cleanup"
    - check_cleanup.stdout not in ["", "LOG_NOT_FOUND"]
