```yaml
---
- name: Definir variáveis da instância
  set_fact:
    oracle_sid: "{{ db.sid }}"
    instance_base_dir: "{{ base_dir }}/{{ db.sid | lower }}"
    log_dir: "{{ base_dir }}/{{ db.sid | lower }}/logs"

- name: Garantir diretório de logs
  raw: mkdir -p {{ log_dir }}
  changed_when: false

- name: Definir timestamp
  set_fact:
    DATA: "{{ lookup('pipe','date +%Y%m%d_%H%M') }}"

# =========================================================
# ARCHIVELOG
# =========================================================

- block:

    - name: Executar backup ARCHIVELOG
      raw: |
        set -e

        export ORACLE_SID={{ oracle_sid }}
        export ORACLE_HOME={{ oracle_home }}
        export PATH=$ORACLE_HOME/bin:$PATH

        LOG={{ log_dir }}/backup_archivelog_{{ oracle_sid }}_{{ DATA }}.log

        cat <<EOF > /tmp/rman_arch_{{ oracle_sid }}.rcv
        RUN {
          allocate channel d1 device type disk
          format '{{ instance_base_dir }}/bkp_arc_%d_%U.rman'
          MAXPIECESIZE 64G;

          allocate channel d2 device type disk
          format '{{ instance_base_dir }}/bkp_arc_%d_%U.rman'
          MAXPIECESIZE 64G;

          BACKUP ARCHIVELOG ALL DELETE INPUT;

          release channel d1;
          release channel d2;
        }

        exit;
        EOF

        $ORACLE_HOME/bin/rman target / \
          cmdfile=/tmp/rman_arch_{{ oracle_sid }}.rcv \
          log=${LOG}

      register: arch_exec
      retries: 2
      delay: 30
      until: arch_exec.rc == 0

    - name: Validar log ARCHIVELOG
      raw: |
        LOG={{ log_dir }}/backup_archivelog_{{ oracle_sid }}_{{ DATA }}.log

        if [ ! -f "$LOG" ]; then
          echo LOG_NOT_FOUND
          exit 0
        fi

        grep -E "RMAN-|ORA-" "$LOG" \
        | grep -v -E \
        "RMAN-08137|RMAN-08120|RMAN-08591|ORA-19606" \
        || true

      register: check_arch

    - name: Falhar se erro ARCHIVELOG
      fail:
        msg: "Erro RMAN ARCHIVELOG SID {{ oracle_sid }}: {{ check_arch.stdout }}"
      when:
        - check_arch.stdout not in ["", "LOG_NOT_FOUND"]

  when: backup_type == "archivelog"

# =========================================================
# FULL
# =========================================================

- block:

    - name: Executar backup FULL
      raw: |
        set -e

        export ORACLE_SID={{ oracle_sid }}
        export ORACLE_HOME={{ oracle_home }}
        export PATH=$ORACLE_HOME/bin:$PATH

        LOG={{ log_dir }}/backup_full_{{ oracle_sid }}_{{ DATA }}.log

        cat <<EOF > /tmp/rman_full_{{ oracle_sid }}.rcv
        RUN {

          allocate channel d1 device type disk
          format '{{ instance_base_dir }}/bkp_full_%d_%U.rman'
          MAXPIECESIZE 64G;

          allocate channel d2 device type disk
          format '{{ instance_base_dir }}/bkp_full_%d_%U.rman'
          MAXPIECESIZE 64G;

          BACKUP AS COMPRESSED BACKUPSET
          INCREMENTAL LEVEL 0
          DATABASE PLUS ARCHIVELOG;

          release channel d1;
          release channel d2;
        }

        exit;
        EOF

        $ORACLE_HOME/bin/rman target / \
          cmdfile=/tmp/rman_full_{{ oracle_sid }}.rcv \
          log=${LOG}

      register: full_exec
      retries: 2
      delay: 30
      until: full_exec.rc == 0

    - name: Validar log FULL
      raw: |
        LOG={{ log_dir }}/backup_full_{{ oracle_sid }}_{{ DATA }}.log

        if [ ! -f "$LOG" ]; then
          echo LOG_NOT_FOUND
          exit 0
        fi

        grep -E "RMAN-|ORA-" "$LOG" \
        | grep -v -E \
        "RMAN-08137|RMAN-08120|RMAN-08591|ORA-19606" \
        || true

      register: check_full

    - name: Falhar se erro FULL
      fail:
        msg: "Erro RMAN FULL SID {{ oracle_sid }}: {{ check_full.stdout }}"
      when:
        - check_full.stdout not in ["", "LOG_NOT_FOUND"]

  when: backup_type == "full"

# =========================================================
# CLEANUP
# =========================================================

- block:

    - name: Executar cleanup RMAN
      raw: |
        set -e

        export ORACLE_SID={{ oracle_sid }}
        export ORACLE_HOME={{ oracle_home }}
        export PATH=$ORACLE_HOME/bin:$PATH

        LOG={{ log_dir }}/cleanup_{{ oracle_sid }}_{{ DATA }}.log

        cat <<EOF > /tmp/rman_cleanup_{{ oracle_sid }}.rcv

        CONFIGURE RETENTION POLICY TO RECOVERY WINDOW OF 30 DAYS;

        CROSSCHECK ARCHIVELOG ALL;
        DELETE NOPROMPT EXPIRED ARCHIVELOG ALL;

        CROSSCHECK BACKUP;
        DELETE NOPROMPT EXPIRED BACKUP;

        CROSSCHECK COPY;
        DELETE NOPROMPT EXPIRED COPY;

        DELETE NOPROMPT OBSOLETE DEVICE TYPE DISK;

        exit;
        EOF

        $ORACLE_HOME/bin/rman target / \
          cmdfile=/tmp/rman_cleanup_{{ oracle_sid }}.rcv \
          log=${LOG}

      register: cleanup_exec
      retries: 2
      delay: 30
      until: cleanup_exec.rc == 0

    - name: Validar log CLEANUP
      raw: |
        LOG={{ log_dir }}/cleanup_{{ oracle_sid }}_{{ DATA }}.log

        if [ ! -f "$LOG" ]; then
          echo LOG_NOT_FOUND
          exit 0
        fi

        grep -E "RMAN-|ORA-" "$LOG" \
        | grep -v -E \
        "RMAN-08137|RMAN-08120|RMAN-08591|ORA-19606" \
        || true

      register: check_cleanup

    - name: Falhar se erro CLEANUP
      fail:
        msg: "Erro RMAN CLEANUP SID {{ oracle_sid }}: {{ check_cleanup.stdout }}"
      when:
        - check_cleanup.stdout not in ["", "LOG_NOT_FOUND"]

  when: backup_type == "cleanup"

# =========================================================
# RESULTADO
# =========================================================

- name: Registrar resultado RMAN
  set_fact:
    rman_result: "{{ (rman_result | default([])) + [ {
      'host': inventory_hostname,
      'sid': oracle_sid,
      'status': 'SUCCESS',
      'status_class': 'success',
      'log': log_dir
    } ] }}"
```
