---
- name: RMAN Backup Oracle Enterprise
  hosts: all
  gather_facts: no
  become: yes
  become_method: sudo
  become_user: oracle

  serial: 2

  vars:
    base_dir: /mnt/oracle_FLZ001/oracle/prd
    backup_type: "{{ tipo_backup }}"

  tasks:

    - name: Validar instâncias
      fail:
        msg: "oracle_instances não definido"
      when: oracle_instances is not defined

    - name: Executar backup por instância
      include_tasks: tasks/rman_instance.yml
      loop: "{{ oracle_instances }}"
      loop_control:
        loop_var: db
        - name: Consolidar relatório
  hosts: localhost
  gather_facts: no

  vars:
    report_date: "{{ lookup('pipe','date +%Y-%m-%d_%H:%M') }}"

  tasks:

    - name: Consolidar dados
      set_fact:
        report_data: >-
          {{
            groups['all']
            | map('extract', hostvars, 'rman_result')
            | select('defined')
            | list
          }}

    - name: Gerar relatório HTML
      template:
        src: templates/rman_report.html.j2
        dest: /tmp/rman_report.html

    - name: Exibir localização do relatório
      debug:
        msg: "Relatório gerado em /tmp/rman_report.html"
