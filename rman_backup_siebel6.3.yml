- name: RMAN Backup Oracle Enterprise
  hosts: all
  gather_facts: no
  become: yes
  become_method: sudo
  become_user: oracle

  vars:
    oracle_sid: sbprd
    oracle_home: /u01/app/oracle/product/11.2.0.4/dbhome_1
    base_dir: /mnt/oracle_FLZ001/oracle/prd/sbprd
    log_dir: "{{ base_dir }}/logs"
    backup_type: "{{ tipo_backup }}"

  tasks:

    - name: Garantir diretório de logs
      raw: mkdir -p {{ log_dir }}
      changed_when: false

    # =========================
    # ARCHIVELOG
    # =========================
    - name: Executar backup ARCHIVELOG
      raw: |
        export ORACLE_SID={{ oracle_sid }}
        export ORACLE_HOME={{ oracle_home }}
        export PATH=$ORACLE_HOME/bin:$PATH

        DATA=$(date "+%Y%m%d_%H%M")
        LOG={{ log_dir }}/backup_archivelog_{{ oracle_sid }}_${DATA}.log
        TMPFILE=/tmp/rman_arch_{{ oracle_sid }}.logpath

        echo $LOG > $TMPFILE

        $ORACLE_HOME/bin/rman target / log=${LOG} <<EOF
        RUN {
          allocate channel d1 type disk format '{{ base_dir }}/bkp_arc_%d_%U.rman' MAXPIECESIZE 30G;
          allocate channel d2 type disk format '{{ base_dir }}/bkp_arc_%d_%U.rman' MAXPIECESIZE 30G;

          BACKUP ARCHIVELOG ALL DELETE INPUT;

          release channel d1;
          release channel d2;
          allocate channel d3 type disk; 
          backup spfile format '{{ base_dir }}/backup%d_%s_%p_%c_%t.spfile.rman';
          release channel d3;
          allocate channel d4 type disk; 
          backup current controlfile format '{{ base_dir }}/bkp_ctl_%d_%D%M%Y%t.rman';
          release channel d4;
        }
        exit;
        EOF
      when: backup_type == "archivelog"

    - name: Validar log ARCHIVELOG
      raw: |
        TMPFILE=/tmp/rman_arch_{{ oracle_sid }}.logpath

        if [ ! -f "$TMPFILE" ]; then
          echo "LOG_NOT_FOUND"
          exit 0
        fi

        LOG=$(cat $TMPFILE)

        if [ ! -f "$LOG" ]; then
          echo "LOG_NOT_FOUND"
          exit 0
        fi

        grep -E "RMAN-|ORA-" "$LOG" \
        | grep -v -E "RMAN-08137|RMAN-08120" \
        || true
      register: check_arch
      when: backup_type == "archivelog"

    - name: Falhar se erro ARCHIVELOG
      fail:
        msg: "Erro no RMAN ARCHIVELOG: {{ check_arch.stdout }}"
      when:
        - backup_type == "archivelog"
        - check_arch.stdout != ""
        - check_arch.stdout != "LOG_NOT_FOUND"

    # =========================
    # FULL
    # =========================
    - name: Executar backup FULL
      raw: |
        export ORACLE_SID={{ oracle_sid }}
        export ORACLE_HOME={{ oracle_home }}
        export PATH=$ORACLE_HOME/bin:$PATH

        DATA=$(date "+%Y%m%d_%H%M")
        LOG={{ log_dir }}/backup_full_{{ oracle_sid }}_${DATA}.log
        TMPFILE=/tmp/rman_full_{{ oracle_sid }}.logpath

        echo $LOG > $TMPFILE

        $ORACLE_HOME/bin/rman target / log=${LOG} <<EOF
        RUN {
          allocate channel d1 type disk format '{{ base_dir }}/bkp_full_%d_%U.rman' MAXPIECESIZE 30G;
          allocate channel d2 type disk format '{{ base_dir }}/bkp_full_%d_%U.rman' MAXPIECESIZE 30G;
          allocate channel d3 type disk format '{{ base_dir }}/bkp_full_%d_%U.rman' MAXPIECESIZE 30G;
          allocate channel d4 type disk format '{{ base_dir }}/bkp_full_%d_%U.rman' MAXPIECESIZE 30G;

          BACKUP AS COMPRESSED BACKUPSET INCREMENTAL LEVEL 0 DATABASE PLUS ARCHIVELOG;

          release channel d1;
          release channel d2;
          release channel d3;
          release channel d4;
          allocate channel d5 type disk;
          backup spfile format '{{ base_dir }}/backup%d_%s_%p_%c_%t.spfile.rman';
          release channel d5; 
          allocate channel d6 type disk;
          backup current controlfile format '{{ base_dir }}/bkp_ctl_%d_%D%M%Y%t.rman';
          release channel d6;
        }
        exit;
        EOF
      when: backup_type == "full"

    - name: Validar log FULL
      raw: |
        TMPFILE=/tmp/rman_full_{{ oracle_sid }}.logpath

        if [ ! -f "$TMPFILE" ]; then
          echo "LOG_NOT_FOUND"
          exit 0
        fi

        LOG=$(cat $TMPFILE)

        if [ ! -f "$LOG" ]; then
          echo "LOG_NOT_FOUND"
          exit 0
        fi

        grep -E "RMAN-|ORA-" "$LOG" \
        | grep -v -E "RMAN-08137|RMAN-08120" \
        || true
      register: check_full
      when: backup_type == "full"

    - name: Falhar se erro FULL
      fail:
        msg: "Erro no RMAN FULL: {{ check_full.stdout }}"
      when:
        - backup_type == "full"
        - check_full.stdout != ""
        - check_full.stdout != "LOG_NOT_FOUND"

    # =========================
    # CLEANUP
    # =========================
    - name: Executar cleanup RMAN
      raw: |
        export ORACLE_SID={{ oracle_sid }}
        export ORACLE_HOME={{ oracle_home }}
        export PATH=$ORACLE_HOME/bin:$PATH

        DATA=$(date "+%Y%m%d_%H%M")
        LOG={{ log_dir }}/cleanup_{{ oracle_sid }}_${DATA}.log
        TMPFILE=/tmp/rman_cleanup_{{ oracle_sid }}.logpath

        echo $LOG > $TMPFILE

        $ORACLE_HOME/bin/rman target / log=${LOG} <<EOF
        CONFIGURE RETENTION POLICY TO RECOVERY WINDOW OF 30 DAYS;
        CROSSCHECK BACKUP;
        DELETE NOPROMPT OBSOLETE DEVICE TYPE DISK;
        exit;
        EOF
      when: backup_type == "cleanup"

    - name: Validar log CLEANUP
      raw: |
        TMPFILE=/tmp/rman_cleanup_{{ oracle_sid }}.logpath

        if [ ! -f "$TMPFILE" ]; then
          echo "LOG_NOT_FOUND"
          exit 0
        fi

        LOG=$(cat $TMPFILE)

        if [ ! -f "$LOG" ]; then
          echo "LOG_NOT_FOUND"
          exit 0
        fi

        grep -E "RMAN-|ORA-" "$LOG" \
        | grep -v -E "RMAN-08137|RMAN-08120" \
        || true
      register: check_cleanup
      when: backup_type == "cleanup"

    - name: Falhar se erro CLEANUP
      fail:
        msg: "Erro no RMAN CLEANUP: {{ check_cleanup.stdout }}"
      when:
        - backup_type == "cleanup"
        - check_cleanup.stdout != ""
        - check_cleanup.stdout != "LOG_NOT_FOUND"
