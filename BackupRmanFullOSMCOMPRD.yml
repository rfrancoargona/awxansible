---
- name: Executar backup RMAN completo do Oracle
  hosts: all
  become: yes
  become_user: oracle
  vars:
    oracle_sid: "EP2OSMC1"
    backup_dir: "/u03/OSMCOM/backup"
    rman_script: "/home/oracle/backup_full.rman"
    log_file: "{{ backup_dir }}/rman_backup_{{ ansible_date_time.date }}.log"

  tasks:
    - name: Criar diretório de backup se não existir
      file:
        path: "{{ backup_dir }}"
        state: directory
        owner: oracle
        group: oinstall
        mode: '0755'

    - name: Criar script RMAN
      copy:
        dest: "{{ rman_script }}"
        content: |
          RUN {
            ALLOCATE CHANNEL c1 DEVICE TYPE DISK FORMAT '{{ backup_dir }}/full_{{ ansible_date_time.date }}_%U.bkp';
            ALLOCATE CHANNEL c2 DEVICE TYPE DISK FORMAT '{{ backup_dir }}/full_{{ ansible_date_time.date }}_%U.bkp';
            ALLOCATE CHANNEL c3 DEVICE TYPE DISK FORMAT '{{ backup_dir }}/full_{{ ansible_date_time.date }}_%U.bkp';
            ALLOCATE CHANNEL c4 DEVICE TYPE DISK FORMAT '{{ backup_dir }}/full_{{ ansible_date_time.date }}_%U.bkp';
            BACKUP AS COMPRESSED BACKUPSET DATABASE PLUS ARCHIVELOG;
            DELETE NOPROMPT OBSOLETE;
            RELEASE CHANNEL c1;
          }
        owner: oracle
        group: oinstall
        mode: '0750'

    - name: Executar backup RMAN
      shell: |
        export ORACLE_SID={{ oracle_sid }}
        export ORACLE_HOME=/u01/app/oracle/product/12.1.0/dbhome_12
        export PATH=$PATH:$ORACLE_HOME/bin:.
        export ORAENV_ASK=NO
        . /usr/local/bin/oraenv >/dev/null 2>&1
        rman target / log='{{ log_file }}' cmdfile='{{ rman_script }}'
      args:
        executable: /bin/bash
