- name: Dataguard Snapshot Refresh
  hosts: standby
  become: yes
  become_user: oracle

  vars:
    oracle_sid: sbprdbcv

  tasks:

  - name: Convert snapshot to physical
    shell: |
      source ~/.bash_profile
      export ORACLE_SID={{ oracle_sid }}

      sqlplus -s / as sysdba <<EOF
      shutdown immediate;
      startup mount;
      alter database convert to physical standby;
      shutdown immediate;
      startup mount;
      exit;
      EOF

  - name: Start recovery
    shell: |
      source ~/.bash_profile
      export ORACLE_SID={{ oracle_sid }}

      sqlplus -s / as sysdba <<EOF
      alter database recover managed standby database using current logfile disconnect;
      exit;
      EOF

  - name: Wait for recovery finish
    shell: |
      source ~/.bash_profile
      export ORACLE_SID={{ oracle_sid }}

      sqlplus -s / as sysdba <<EOF
      set heading off
      set feedback off
      select status from v\$managed_standby where process='MRP0';
      exit;
      EOF
    register: mrp_status
    until: "'WAIT_FOR_LOG' in mrp_status.stdout or 'IDLE' in mrp_status.stdout"
    retries: 120
    delay: 120

  - name: Cancel recovery
    shell: |
      source ~/.bash_profile
      export ORACLE_SID={{ oracle_sid }}

      sqlplus -s / as sysdba <<EOF
      alter database recover managed standby database cancel;
      exit;
      EOF

  - name: Convert to snapshot
    shell: |
      source ~/.bash_profile
      export ORACLE_SID={{ oracle_sid }}

      sqlplus -s / as sysdba <<EOF
      alter database convert to snapshot standby;
      shutdown immediate;
      startup;
      exit;
      EOF
