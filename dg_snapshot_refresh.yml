- name: Dataguard Snapshot Refresh STABLE
  hosts: standby
  become: yes
  become_user: oracle
  gather_facts: no

  vars:
    oracle_sid: sbprdbcv
    sync_window_seconds: 4200
    log_file: /tmp/dg_refresh.log

  tasks:

  - name: Start log header
    raw: |
      echo "=================================" >> {{ log_file }}
      echo "DG REFRESH START $(date)" >> {{ log_file }}
      echo "=================================" >> {{ log_file }}

  - name: Convert snapshot to physical standby
    raw: |
      source ~/.bash_profile
      export ORACLE_SID={{ oracle_sid }}

      sqlplus / as sysdba <<EOF >> {{ log_file }}
      shutdown immediate;
      startup mount;
      alter database convert to physical standby;
      shutdown immediate;
      startup mount;
      exit;
      EOF

  - name: Start managed recovery
    raw: |
      source ~/.bash_profile
      export ORACLE_SID={{ oracle_sid }}

      sqlplus / as sysdba <<EOF >> {{ log_file }}
      alter database recover managed standby database using current logfile disconnect;
      exit;
      EOF

  - name: Wait fixed sync window
    raw: |
      echo "Sync window started $(date)" >> {{ log_file }}
      sleep {{ sync_window_seconds }}
      echo "Sync window finished $(date)" >> {{ log_file }}

  - name: Cancel managed recovery
    raw: |
      source ~/.bash_profile
      export ORACLE_SID={{ oracle_sid }}

      sqlplus / as sysdba <<EOF >> {{ log_file }}
      alter database recover managed standby database cancel;
      exit;
      EOF

  - name: Convert to snapshot standby
    raw: |
      source ~/.bash_profile
      export ORACLE_SID={{ oracle_sid }}

      sqlplus / as sysdba <<EOF >> {{ log_file }}
      alter database convert to snapshot standby;
      shutdown immediate;
      startup;
      exit;
      EOF

  - name: Validate open mode
    raw: |
      source ~/.bash_profile
      export ORACLE_SID={{ oracle_sid }}

      sqlplus -s / as sysdba <<EOF >> {{ log_file }}
      set heading off
      select open_mode from v\$database;
      exit;
      EOF

  - name: Finish log
    raw: |
      echo "DG REFRESH END $(date)" >> {{ log_file }}
      echo "=================================" >> {{ log_file }}
