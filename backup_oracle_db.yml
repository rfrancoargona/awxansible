---
- name: Backup de Banco de Dados Oracle ODB1
  hosts: all
  become: yes  # Run tasks with elevated privileges (e.g., as oracle user)
  vars:
    oracle_sid: odb1  # Replace with your Oracle SID
    backup_destination: /backup/oracle/odb1  # Replace with your desired backup path

  tasks:
    - name: Set Oracle environment variables
      shell: |
        export ORACLE_HOME=/u01/app/oracle/product/19.0.0/dbhome_1  # Replace with your Oracle Home
        export ORACLE_SID=odb1
        export PATH=$ORACLE_HOME/bin:$PATH
      args:
        executable: /bin/bash
        register: enviroments_output

    - name: Display Variaveis de Ambiente
      debug:
        msg: enviroments_output.stdout_lines
        
    - name: Create backup destination directory if it doesn't exist
      file:
        path: "/backup/oracle/odb1"
        state: directory
        owner: oracle
        group: oinstall
        mode: '0755'

    - name: Execute RMAN backup
      shell: |
        rman target / <<EOF
        RUN {
        ALLOCATE CHANNEL d1 DEVICE TYPE DISK FORMAT '{{ backup_destination }}/%U';
        BACKUP DATABASE PLUS ARCHIVELOG DELETE INPUT;
        RELEASE CHANNEL d1;
        }
        EOF
      args:
        executable: /bin/bash
      register: rman_output

    - name: Display RMAN backup output
      debug:
        msg: rman_output.stdout_lines
